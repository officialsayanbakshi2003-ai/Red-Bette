services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redbetta
      POSTGRES_PASSWORD: redbetta
      POSTGRES_DB: redbetta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redbetta"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://redbetta:redbetta@db:5432/redbetta?schema=public
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    profiles: ["app"]

volumes:
  pgdata:
  uploads:
